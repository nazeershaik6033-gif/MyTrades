<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Journal</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}

/* ─── DARK THEME ─── */
:root,[data-theme="dark"]{
  --bg:#060609;--surf:#0d0d1a;--card:#0f0f1e;--border:#1a1a2e;--border2:#252540;
  --text:#dde0f5;--muted:#4a4a70;--muted2:#2a2a45;
  --hbg:#08080f;--pbg:#0a0a14;--fbg:#05050d;--ibg:#07070f;
  --live:#00e676;--closed:#ff6b35;--bc:#4488ff;--ac:#00c853;
  --danger:#ff1744;--entry:#a78bfa;
  --scrollbar:#1e1e35;--ic:#c5c9e8;--bdg:#1a1a2e;
}
/* ─── LIGHT THEME ─── */
[data-theme="light"]{
  --bg:#f0f3fc;--surf:#e6eaf8;--card:#ffffff;--border:#d0d8f0;--border2:#b8c4e0;
  --text:#1a1c32;--muted:#6878b0;--muted2:#a8b4d0;
  --hbg:#ffffff;--pbg:#f4f7ff;--fbg:#edf0fc;--ibg:#e8ecf8;
  --live:#009944;--closed:#d94f18;--bc:#2255cc;--ac:#008833;
  --danger:#cc1133;--entry:#7c3aed;
  --scrollbar:#c0c8e0;--ic:#1a1c32;--bdg:#dde4f8;
}

html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Space Mono',monospace;transition:background .25s,color .25s}
::-webkit-scrollbar{width:5px;height:5px;background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:3px}
input,textarea,select{font-family:'Space Mono',monospace}
[data-theme="dark"] input,[data-theme="dark"] textarea,[data-theme="dark"] select{color-scheme:dark}
[data-theme="light"] input,[data-theme="light"] textarea,[data-theme="light"] select{color-scheme:light}
button{font-family:'Space Mono',monospace;cursor:pointer}
textarea{resize:vertical}

/* ─── HEADER ─── */
.header{
  background:var(--hbg);border-bottom:1px solid var(--border);
  padding:16px 32px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);transition:background .25s,border-color .25s;
}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{color:var(--live);font-size:19px;font-family:'Syne',sans-serif;font-weight:800}
.logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:19px;letter-spacing:.06em}
.header-meta{font-size:9px;color:var(--muted);letter-spacing:.18em;margin-top:3px}
.header-right{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 2s infinite;flex-shrink:0}
.live-label{font-size:9px;color:var(--muted);letter-spacing:.2em}
.btn-export{background:var(--pbg);border:1px solid var(--border2);color:var(--muted);border-radius:7px;font-size:9px;padding:8px 14px;letter-spacing:.1em;transition:all .18s}
.btn-export:hover{border-color:#4488ff55;color:var(--bc)}
.theme-toggle{display:flex;border:1px solid var(--border2);border-radius:7px;overflow:hidden}
.theme-btn{background:transparent;border:none;color:var(--muted);font-size:9px;padding:7px 11px;letter-spacing:.1em;transition:all .18s}
.theme-btn.active{background:var(--bc);color:#fff}

/* ─── MAIN TABS ─── */
.main-tabs{background:var(--hbg);border-bottom:1px solid var(--border);padding:0 32px;display:flex;transition:background .25s}
.main-tab{
  background:transparent;border:none;border-bottom:2px solid transparent;
  color:var(--muted);padding:13px 20px;font-size:10px;font-weight:700;
  letter-spacing:.16em;transition:all .2s;display:flex;align-items:center;gap:7px;
}
.main-tab.active-entry{color:var(--entry);border-bottom-color:var(--entry)}
.main-tab.active-live{color:var(--live);border-bottom-color:var(--live)}
.main-tab.active-closed{color:var(--closed);border-bottom-color:var(--closed)}
.tab-dot{width:6px;height:6px;border-radius:50%;animation:pulse 2s infinite;flex-shrink:0}

/* ─── LAYOUT ─── */
.layout{max-width:1200px;margin:0 auto;padding:26px 32px}

/* ─── CATEGORY TABS ─── */
.cat-bar{display:flex;gap:7px;margin-bottom:24px;background:var(--hbg);border-radius:10px;padding:5px;border:1px solid var(--border);transition:background .25s}
.cat-tab{flex:1;background:transparent;border:1px solid transparent;border-radius:7px;color:var(--muted);padding:10px 0;font-size:9px;font-weight:700;letter-spacing:.16em;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:7px}
.cat-badge{background:var(--bdg);color:var(--muted);font-size:8px;padding:2px 6px;border-radius:9px;transition:all .2s}

/* ─── EMPTY STATE ─── */
.empty-state{text-align:center;padding:60px 0}
.empty-icon{font-size:38px;margin-bottom:14px;opacity:.35}
.empty-text{font-size:11px;letter-spacing:.2em;margin-bottom:7px;color:var(--muted)}
.empty-sub{font-size:9px;color:var(--muted2);letter-spacing:.1em}

/* ═══ ENTRY TAB ═══ */
.entry-section{display:none}
.entry-section.active{display:block}

.entry-header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.entry-title{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:var(--entry)}
.entry-title-sub{font-size:9px;color:var(--muted);letter-spacing:.14em;margin-top:3px}

/* Category Selector in Entry */
.entry-cat-row{display:flex;gap:8px;margin-bottom:24px}
.entry-cat-btn{
  flex:1;background:var(--pbg);border:1px solid var(--border2);border-radius:9px;
  color:var(--muted);padding:12px 0;font-size:10px;font-weight:700;letter-spacing:.14em;
  transition:all .2s;
}
.entry-cat-btn.active{background:var(--entry)18;border-color:var(--entry)66;color:var(--entry)}

/* Entry Form Panels */
.entry-panels{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
@media(max-width:768px){.entry-panels{grid-template-columns:1fr}}

/* After chart toggle in entry */
.after-toggle-bar{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--pbg);border:1px solid var(--border);border-radius:9px;
  padding:12px 16px;margin-bottom:16px;cursor:pointer;transition:all .18s;
}
.after-toggle-bar:hover{border-color:var(--ac)44}
.after-toggle-label{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.after-toggle-icon{font-size:11px;color:var(--muted2);transition:transform .2s}
.after-toggle-icon.open{transform:rotate(90deg)}
.after-chart-wrap{display:none}
.after-chart-wrap.open{display:block}

.btn-submit{
  width:100%;padding:15px;border-radius:11px;font-size:11px;font-weight:700;
  letter-spacing:.2em;border:none;background:var(--entry);color:#fff;
  transition:all .2s;margin-top:4px;
}
.btn-submit:hover{background:#8b5cf6;transform:translateY(-1px)}
.btn-submit:active{transform:translateY(0)}

/* ═══ FORM PANEL (shared: entry + edit) ═══ */
.form-panel{
  background:var(--pbg);border-radius:11px;border:1px solid;
  padding:16px;display:flex;flex-direction:column;gap:11px;transition:background .25s;
}
.panel-title{font-size:9px;font-weight:700;letter-spacing:.2em;padding-bottom:9px;border-bottom:1px solid;margin-bottom:2px}

/* ─── IMAGE ZONE ─── */
.image-zone{
  width:100%;aspect-ratio:16/9;border-radius:8px;border:2px dashed var(--border2);
  background:var(--ibg);display:flex;align-items:center;justify-content:center;
  cursor:pointer;overflow:hidden;position:relative;transition:all .18s;
}
.image-zone:hover{border-color:var(--bc)}
.image-zone.drag-over{border-color:var(--bc);background:#4488ff12}
.up-placeholder{text-align:center;pointer-events:none}
.up-icon{font-size:26px;opacity:.25;margin-bottom:7px}
.up-text{font-size:8px;color:var(--muted2);letter-spacing:.12em}
.chart-img{width:100%;height:100%;object-fit:cover;display:block}
.img-overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:flex-end;gap:5px;padding:7px;opacity:0;transition:opacity .2s}
.image-zone:hover .img-overlay{opacity:1}
.btn-sm{font-size:8px;padding:3px 8px;border-radius:4px;letter-spacing:.07em;border:1px solid}
.btn-blue{background:#4488ff22;color:#4488ff;border-color:#4488ff55}
.btn-red{background:#ff174422;color:#ff5252;border-color:#ff174455}
.hidden-input{display:none}

/* ─── FORM FIELDS ─── */
.field-group{display:flex;flex-direction:column;gap:3px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.field-label{font-size:8px;letter-spacing:.13em;color:var(--muted2);text-transform:uppercase}
.field-input{
  background:var(--fbg);border:1px solid var(--border2);border-radius:6px;
  color:var(--ic);font-size:11px;padding:8px 9px;outline:none;
  transition:border-color .18s,background .25s,color .25s;width:100%;
}
.field-input:focus{border-color:var(--focus-c,var(--bc))}
.field-textarea{min-height:68px}

/* ═══ TRADE SUMMARY CARDS ═══ */
.trade-card{
  background:var(--card);border-radius:13px;border:1px solid var(--border);
  margin-bottom:16px;overflow:hidden;transition:background .25s,border-color .25s;
}
[data-theme="dark"] .trade-card{box-shadow:0 4px 28px rgba(0,0,0,.45)}
[data-theme="light"] .trade-card{box-shadow:0 2px 16px rgba(100,120,200,.08)}
.trade-card{animation:fadeIn .22s ease}

/* Card Header */
.card-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 18px;background:var(--hbg);border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .18s;
}
.card-header:hover{background:var(--surf)}
.card-header-left{display:flex;align-items:center;gap:11px}
.trade-num{font-size:9px;font-weight:700;letter-spacing:.12em;padding:3px 9px;border-radius:18px;border:1px solid;flex-shrink:0}
.trade-sym{font-size:13px;font-weight:700;color:var(--text)}
.trade-cat-tag{font-size:8px;letter-spacing:.1em;padding:2px 7px;border-radius:5px;font-weight:700;border:1px solid}
.trade-dt{color:var(--muted2);font-size:9px;letter-spacing:.08em}
.card-header-right{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.chevron{color:var(--muted2);font-size:11px;user-select:none;transition:transform .2s}

/* Card action buttons */
.btn-act{border-radius:6px;font-size:9px;padding:4px 10px;letter-spacing:.09em;transition:all .18s;font-weight:700;border:1px solid;background:transparent}
.btn-edit{color:#60a5fa99;border-color:#60a5fa33}
.btn-edit:hover{background:#60a5fa18;color:#60a5fa;border-color:#60a5fa66}
.btn-close-trade{color:#ff6b35aa;border-color:#ff6b3540}
.btn-close-trade:hover{background:#ff6b3518;color:#ff6b35;border-color:#ff6b3588}
.btn-pdf{color:#a78bfaaa;border-color:#a78bfa40}
.btn-pdf:hover{background:#a78bfa18;color:#a78bfa;border-color:#a78bfa88}
.btn-danger{color:#ff525277;border-color:#ff174430}
.btn-danger:hover{background:#ff174418;color:#ff5252;border-color:#ff174455}
.btn-save{color:#00e676;border-color:#00e67644;background:#00e67610}
.btn-save:hover{background:#00e67620;border-color:#00e67688}
.btn-cancel{color:var(--muted);border-color:var(--border2)}
.btn-cancel:hover{color:var(--text);border-color:var(--border)}

/* Card Body */
.card-body{padding:18px;background:var(--card);transition:background .25s}

/* ─── SUMMARY PANELS ─── */
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:768px){.summary-grid{grid-template-columns:1fr}}
.summary-panel{background:var(--pbg);border-radius:10px;border:1px solid;padding:14px;display:flex;flex-direction:column;gap:10px;transition:background .25s}
.sum-panel-title{font-size:9px;font-weight:700;letter-spacing:.18em;padding-bottom:8px;border-bottom:1px solid;margin-bottom:2px}

/* Summary image */
.sum-img-wrap{width:100%;aspect-ratio:16/9;border-radius:7px;overflow:hidden;border:1px solid var(--border2);background:var(--ibg)}
.sum-img-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.sum-no-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted2);font-size:9px;letter-spacing:.1em;flex-direction:column;gap:6px}
.sum-no-img-icon{font-size:22px;opacity:.25}

/* Summary fields */
.sum-fields{display:flex;flex-direction:column;gap:8px}
.sum-field{display:flex;flex-direction:column;gap:2px}
.sum-lbl{font-size:8px;letter-spacing:.13em;color:var(--muted2);text-transform:uppercase}
.sum-val{font-size:11px;color:var(--text);word-break:break-word;line-height:1.5}
.sum-val-empty{font-size:11px;color:var(--muted2);font-style:italic}
.sum-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}

/* No exit banner */
.no-exit-banner{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;min-height:180px;text-align:center;gap:8px;
}
.no-exit-icon{font-size:28px;opacity:.2}
.no-exit-text{font-size:9px;letter-spacing:.14em;color:var(--muted2)}
.no-exit-sub{font-size:8px;color:var(--muted2);opacity:.7}

/* Edit panel grid */
.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:768px){.edit-grid{grid-template-columns:1fr}}
.edit-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}

/* Closed info */
.closed-info{background:var(--pbg);border:1px solid #ff6b3528;border-radius:9px;padding:11px 16px;margin-bottom:18px;font-size:9px;color:var(--muted);letter-spacing:.1em;display:flex;align-items:center;gap:9px}

/* ─── TOAST ─── */
.toast{position:fixed;bottom:26px;right:26px;z-index:9999;background:var(--card);border:1px solid;border-radius:8px;border-left:3px solid;padding:11px 18px;font-size:10px;letter-spacing:.08em;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast-success{border-color:#00e67640;border-left-color:var(--live);color:var(--live)}
.toast-error{border-color:#ff174440;border-left-color:var(--danger);color:#ff5252}
.toast-warning{border-color:#ff6b3540;border-left-color:var(--closed);color:var(--closed)}
.toast-info{border-color:#4488ff40;border-left-color:var(--bc);color:var(--bc)}

/* ─── PDF overlay ─── */
.pdf-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s}
.pdf-box{background:var(--card);border:1px solid #a78bfa40;border-radius:12px;padding:28px 40px;text-align:center}
.pdf-spin{font-size:26px;animation:spin 1s linear infinite;margin-bottom:10px}
.pdf-lbl{font-size:10px;color:#a78bfa;letter-spacing:.18em}

/* ─── ANIMS ─── */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes fadeIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ══════════ HEADER ══════════ -->
<div class="header">
  <div>
    <div class="logo">
      <span class="logo-mark">▲</span>
      <span class="logo-text">TRADE JOURNAL</span>
    </div>
    <div class="header-meta" id="total-count">0 trades logged</div>
  </div>
  <div class="header-right">
    <div style="display:flex;align-items:center;gap:5px">
      <div class="live-dot"></div>
      <span class="live-label">LIVE</span>
    </div>
    <div class="theme-toggle">
      <button class="theme-btn" id="btn-dark"  onclick="setTheme('dark')">◑ DARK</button>
      <button class="theme-btn" id="btn-light" onclick="setTheme('light')">☀ LIGHT</button>
    </div>
    <button class="btn-export" onclick="exportXLSX()">⬇ XLSX</button>
    <button class="btn-export" onclick="exportCSV()">⬇ CSV</button>
  </div>
</div>

<!-- ══════════ MAIN TABS ══════════ -->
<div class="main-tabs">
  <button class="main-tab" data-tab="entry" onclick="switchTab('entry')">
    <div class="tab-dot" style="background:var(--entry)"></div>TRADE ENTRY
  </button>
  <button class="main-tab" data-tab="live" onclick="switchTab('live')">
    <div class="tab-dot" style="background:var(--live);animation:pulse 2s infinite"></div>LIVE TRADES
  </button>
  <button class="main-tab" data-tab="closed" onclick="switchTab('closed')">
    CLOSED TRADES
  </button>
</div>

<!-- ══════════ ENTRY SECTION ══════════ -->
<div class="entry-section" id="entry-section">
  <div class="layout">
    <!-- Header row -->
    <div class="entry-header-row">
      <div>
        <div class="entry-title">◈ NEW TRADE ENTRY</div>
        <div class="entry-title-sub">Fill in trade details and submit to Live Trades</div>
      </div>
    </div>

    <!-- Category Selector -->
    <div style="margin-bottom:18px">
      <div class="field-label" style="margin-bottom:8px">SELECT CATEGORY</div>
      <div class="entry-cat-row">
        <button class="entry-cat-btn active" data-ecat="stocks"   onclick="selectEntryCat('stocks')">STOCKS</button>
        <button class="entry-cat-btn"        data-ecat="futures"  onclick="selectEntryCat('futures')">FUTURES</button>
        <button class="entry-cat-btn"        data-ecat="options"  onclick="selectEntryCat('options')">OPTIONS</button>
      </div>
    </div>

    <!-- BEFORE CHART -->
    <div style="margin-bottom:14px">
      <div class="field-label" style="margin-bottom:10px;color:var(--bc)">◀ BEFORE CHART &nbsp;—&nbsp; ENTRY DETAILS</div>
      <div class="form-panel" id="entry-panel-before" style="border-color:#4488ff28">
        <div class="panel-title" style="color:var(--bc);border-color:#4488ff22">BEFORE CHART</div>
        <!-- Image zone -->
        <div class="image-zone" id="entry-iz-before">
          <div class="up-placeholder">
            <div class="up-icon">📈</div>
            <div class="up-text">CLICK OR DROP CHART IMAGE</div>
          </div>
          <input type="file" accept="image/*" class="hidden-input" id="entry-fi-before"
                 onchange="entryFileChange(this,'before')">
        </div>
        <!-- Fields -->
        <div class="field-group">
          <label class="field-label">Trade Name / Setup</label>
          <input class="field-input" id="ef-before-name" type="text" placeholder="e.g. Breakout Long" style="--focus-c:var(--bc)">
        </div>
        <div class="field-group">
          <label class="field-label">Ticker / Symbol</label>
          <input class="field-input" id="ef-before-symbol" type="text" placeholder="NIFTY, BANKNIFTY, RELIANCE..." style="--focus-c:var(--bc)">
        </div>
        <div class="field-row">
          <div class="field-group">
            <label class="field-label">Entry Price</label>
            <input class="field-input" id="ef-before-price" type="text" placeholder="₹0.00" style="--focus-c:var(--bc)">
          </div>
          <div class="field-group">
            <label class="field-label">Date & Time</label>
            <input class="field-input" id="ef-before-datetime" type="datetime-local" style="--focus-c:var(--bc)">
          </div>
        </div>
        <div class="field-group">
          <label class="field-label">Trade Logic / Description</label>
          <textarea class="field-input field-textarea" id="ef-before-description" placeholder="Describe your entry reasoning, setup conditions..." style="--focus-c:var(--bc)"></textarea>
        </div>
      </div>
    </div>

    <!-- AFTER CHART toggle -->
    <div class="after-toggle-bar" onclick="toggleAfterChart()">
      <div>
        <span class="after-toggle-label" style="color:var(--ac)">▶ AFTER CHART</span>
        <span style="font-size:9px;color:var(--muted);letter-spacing:.1em;margin-left:10px">— Optional: Add exit details now or later via Edit</span>
      </div>
      <span class="after-toggle-icon" id="after-toggle-icon">▶</span>
    </div>
    <div class="after-chart-wrap" id="after-chart-wrap">
      <div class="form-panel" id="entry-panel-after" style="border-color:#00c85328;margin-bottom:14px">
        <div class="panel-title" style="color:var(--ac);border-color:#00c85322">AFTER CHART</div>
        <div class="image-zone" id="entry-iz-after">
          <div class="up-placeholder">
            <div class="up-icon">📉</div>
            <div class="up-text">CLICK OR DROP CHART IMAGE</div>
          </div>
          <input type="file" accept="image/*" class="hidden-input" id="entry-fi-after"
                 onchange="entryFileChange(this,'after')">
        </div>
        <div class="field-group">
          <label class="field-label">Trade Name / Setup</label>
          <input class="field-input" id="ef-after-name" type="text" placeholder="e.g. Target Hit" style="--focus-c:var(--ac)">
        </div>
        <div class="field-group">
          <label class="field-label">Ticker / Symbol</label>
          <input class="field-input" id="ef-after-symbol" type="text" placeholder="NIFTY, BANKNIFTY, RELIANCE..." style="--focus-c:var(--ac)">
        </div>
        <div class="field-row">
          <div class="field-group">
            <label class="field-label">Exit Price</label>
            <input class="field-input" id="ef-after-price" type="text" placeholder="₹0.00" style="--focus-c:var(--ac)">
          </div>
          <div class="field-group">
            <label class="field-label">Date & Time</label>
            <input class="field-input" id="ef-after-datetime" type="datetime-local" style="--focus-c:var(--ac)">
          </div>
        </div>
        <div class="field-group">
          <label class="field-label">Trade Logic / Description</label>
          <textarea class="field-input field-textarea" id="ef-after-description" placeholder="Describe your exit reasoning, outcome..." style="--focus-c:var(--ac)"></textarea>
        </div>
      </div>
    </div>

    <!-- Submit -->
    <button class="btn-submit" onclick="submitEntry()">◈ ADD TO LIVE TRADES</button>
  </div>
</div>

<!-- ══════════ TRADES SECTION ══════════ -->
<div id="trades-section" style="display:none">
  <div class="layout">
    <div class="cat-bar">
      <button class="cat-tab" data-cat="stocks"  onclick="switchCat('stocks')">STOCKS<span class="cat-badge" id="cnt-stocks">0</span></button>
      <button class="cat-tab" data-cat="futures" onclick="switchCat('futures')">FUTURES<span class="cat-badge" id="cnt-futures">0</span></button>
      <button class="cat-tab" data-cat="options" onclick="switchCat('options')">OPTIONS<span class="cat-badge" id="cnt-options">0</span></button>
    </div>
    <div id="trades-container"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════
let state = {
  trades: {
    live:   { stocks:[], futures:[], options:[] },
    closed: { stocks:[], futures:[], options:[] }
  },
  theme: 'dark'
};
let activeTab = 'entry', activeCat = 'stocks';
let entryCat = 'stocks';
let entryImages = { before: null, after: null };

// Per-trade edit images: { [tradeId]: { before: dataUrl|null, after: dataUrl|null } }
let editImages = {};
// Set of trade IDs currently in edit mode
const editingIds = new Set();

function loadState() {
  try {
    const s = localStorage.getItem('tradejournal_v3');
    if (s) state = JSON.parse(s);
    if (!state.theme)   state.theme = 'dark';
    if (!state.trades.closed) state.trades.closed = { stocks:[], futures:[], options:[] };
  } catch(e) {}
  // Migrate from v2
  try {
    const old = localStorage.getItem('tradejournal_v2');
    if (old && !localStorage.getItem('tradejournal_v3')) {
      const os = JSON.parse(old);
      if (os.trades) {
        state.trades = os.trades;
        if (!state.trades.closed) state.trades.closed = { stocks:[], futures:[], options:[] };
      }
    }
  } catch(e) {}
}

let saveTimer;
function saveState() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem('tradejournal_v3', JSON.stringify(state)); }
    catch(e) { showToast('Storage full! Export data first.','error'); }
  }, 350);
}

// ═══════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function newEntry() { return { name:'', symbol:'', price:'', datetime:'', description:'', image:null }; }
function newTrade() { return { id:uid(), createdAt:new Date().toISOString(), cat:entryCat, before:newEntry(), after:newEntry() }; }

function findTrade(id) {
  for (const sv of Object.values(state.trades))
    for (const cv of Object.values(sv)) { const t = cv.find(t=>t.id===id); if(t) return t; }
  return null;
}
function findTradeLoc(id) {
  for (const [sk,sv] of Object.entries(state.trades))
    for (const [ck,cv] of Object.entries(sv)) {
      const idx = cv.findIndex(t=>t.id===id);
      if(idx!==-1) return {tab:sk,cat:ck,idx};
    }
  return null;
}
function esc(s) {
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmt(v) { return v ? String(v) : ''; }
function fmtDate(v) { return v ? new Date(v).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : ''; }

// ═══════════════════════════════════════════════════
//  THEME
// ═══════════════════════════════════════════════════
function setTheme(t) {
  state.theme = t;
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('btn-dark').classList.toggle('active', t==='dark');
  document.getElementById('btn-light').classList.toggle('active', t==='light');
  saveState();
}
function applyTheme() {
  const t = state.theme || 'dark';
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('btn-dark').classList.toggle('active', t==='dark');
  document.getElementById('btn-light').classList.toggle('active', t==='light');
}

// ═══════════════════════════════════════════════════
//  IMAGE PROCESSING
// ═══════════════════════════════════════════════════
function compressImage(file, cb) {
  const img = new Image(), fr = new FileReader();
  fr.onload = e => {
    img.onload = () => {
      const MAX = 1000, scale = Math.min(MAX / Math.max(img.width, img.height), 1);
      const c = document.createElement('canvas');
      c.width = img.width*scale; c.height = img.height*scale;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.78));
    };
    img.src = e.target.result;
  };
  fr.readAsDataURL(file);
}

function makeImageZoneHtml(dataUrl, triggerFn, clearFn) {
  if (dataUrl) return `
    <img src="${dataUrl}" alt="chart" class="chart-img">
    <div class="img-overlay">
      <button class="btn-sm btn-blue" onclick="${triggerFn}">CHANGE</button>
      <button class="btn-sm btn-red"  onclick="${clearFn}">✕ REMOVE</button>
    </div>`;
  return `<div class="up-placeholder"><div class="up-icon">📈</div><div class="up-text">CLICK OR DROP CHART IMAGE</div></div>`;
}

// ─── Entry form image zones ───
function attachEntryImageZone(side) {
  const zone = document.getElementById('entry-iz-'+side);
  if (!zone) return;
  zone.onclick = e => { if(!e.target.closest('button')) document.getElementById('entry-fi-'+side).click(); };
  zone.ondragover = e => { e.preventDefault(); zone.classList.add('drag-over'); };
  zone.ondragleave = () => zone.classList.remove('drag-over');
  zone.ondrop = e => {
    e.preventDefault(); zone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if(f && f.type.startsWith('image/')) entryImageProcess(f, side);
  };
}
function entryFileChange(input, side) { if(input.files[0]) entryImageProcess(input.files[0], side); }
function entryImageProcess(file, side) {
  compressImage(file, dataUrl => {
    entryImages[side] = dataUrl;
    const zone = document.getElementById('entry-iz-'+side);
    if (!zone) return;
    zone.innerHTML = makeImageZoneHtml(dataUrl,
      `entryTriggerInput('${side}')`,
      `entryImageClear('${side}')`) +
      `<input type="file" accept="image/*" class="hidden-input" id="entry-fi-${side}" onchange="entryFileChange(this,'${side}')">`;
    attachEntryImageZone(side);
    showToast('Chart image attached!');
  });
}
function entryTriggerInput(side) { document.getElementById('entry-fi-'+side).click(); }
function entryImageClear(side) {
  entryImages[side] = null;
  const zone = document.getElementById('entry-iz-'+side);
  if (!zone) return;
  zone.innerHTML = `<div class="up-placeholder"><div class="up-icon">📈</div><div class="up-text">CLICK OR DROP CHART IMAGE</div></div>
    <input type="file" accept="image/*" class="hidden-input" id="entry-fi-${side}" onchange="entryFileChange(this,'${side}')">`;
  attachEntryImageZone(side);
}

// ─── Edit form image zones ───
function attachEditImageZone(tradeId, side) {
  const zone = document.getElementById(`eiz-${tradeId}-${side}`);
  if (!zone) return;
  zone.onclick = e => { if(!e.target.closest('button')) document.getElementById(`efi-${tradeId}-${side}`).click(); };
  zone.ondragover = e => { e.preventDefault(); zone.classList.add('drag-over'); };
  zone.ondragleave = () => zone.classList.remove('drag-over');
  zone.ondrop = e => {
    e.preventDefault(); zone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if(f && f.type.startsWith('image/')) editImageProcess(f, tradeId, side);
  };
}
function editFileChange(input, tradeId, side) { if(input.files[0]) editImageProcess(input.files[0], tradeId, side); }
function editImageProcess(file, tradeId, side) {
  compressImage(file, dataUrl => {
    if (!editImages[tradeId]) editImages[tradeId] = { before:null, after:null };
    editImages[tradeId][side] = dataUrl;
    const zone = document.getElementById(`eiz-${tradeId}-${side}`);
    if (!zone) return;
    zone.innerHTML = makeImageZoneHtml(dataUrl,
      `editTrigger('${tradeId}','${side}')`,
      `editImageClear('${tradeId}','${side}')`) +
      `<input type="file" accept="image/*" class="hidden-input" id="efi-${tradeId}-${side}" onchange="editFileChange(this,'${tradeId}','${side}')">`;
    attachEditImageZone(tradeId, side);
    showToast('Chart image updated!');
  });
}
function editTrigger(tradeId, side) { document.getElementById(`efi-${tradeId}-${side}`).click(); }
function editImageClear(tradeId, side) {
  if (!editImages[tradeId]) editImages[tradeId] = { before:null, after:null };
  editImages[tradeId][side] = null;
  const zone = document.getElementById(`eiz-${tradeId}-${side}`);
  if (!zone) return;
  zone.innerHTML = `<div class="up-placeholder"><div class="up-icon">📈</div><div class="up-text">CLICK OR DROP CHART IMAGE</div></div>
    <input type="file" accept="image/*" class="hidden-input" id="efi-${tradeId}-${side}" onchange="editFileChange(this,'${tradeId}','${side}')">`;
  attachEditImageZone(tradeId, side);
}

// ═══════════════════════════════════════════════════
//  ENTRY TAB
// ═══════════════════════════════════════════════════
function selectEntryCat(cat) {
  entryCat = cat;
  document.querySelectorAll('.entry-cat-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.ecat === cat);
  });
}

function toggleAfterChart() {
  const wrap = document.getElementById('after-chart-wrap');
  const icon = document.getElementById('after-toggle-icon');
  const open = wrap.classList.toggle('open');
  icon.classList.toggle('open', open);
  if (open) setTimeout(() => { attachEntryImageZone('after'); }, 0);
}

function submitEntry() {
  // Read values from form
  const before = {
    name:        document.getElementById('ef-before-name').value.trim(),
    symbol:      document.getElementById('ef-before-symbol').value.trim(),
    price:       document.getElementById('ef-before-price').value.trim(),
    datetime:    document.getElementById('ef-before-datetime').value,
    description: document.getElementById('ef-before-description').value.trim(),
    image:       entryImages.before
  };

  if (!before.symbol && !before.name) {
    showToast('Please enter at least a Symbol or Trade Name.', 'warning');
    return;
  }

  const after = {
    name:        document.getElementById('ef-after-name').value.trim(),
    symbol:      document.getElementById('ef-after-symbol').value.trim(),
    price:       document.getElementById('ef-after-price').value.trim(),
    datetime:    document.getElementById('ef-after-datetime').value,
    description: document.getElementById('ef-after-description').value.trim(),
    image:       entryImages.after
  };

  const trade = { id:uid(), createdAt:new Date().toISOString(), cat:entryCat, before, after };
  state.trades.live[entryCat].push(trade);
  saveState();

  // Reset form
  resetEntryForm();
  updateCounts();
  showToast(`Trade added to Live ${entryCat.toUpperCase()}!`);
  // Switch to live tab to see it
  switchTab('live');
  activeCat = entryCat;
  renderAll();
}

function resetEntryForm() {
  ['before','after'].forEach(side => {
    ['name','symbol','price','datetime','description'].forEach(f => {
      const el = document.getElementById(`ef-${side}-${f}`);
      if (el) el.value = '';
    });
    entryImageClear(side);
  });
  entryImages = { before:null, after:null };
  // Collapse after chart
  const wrap = document.getElementById('after-chart-wrap');
  const icon = document.getElementById('after-toggle-icon');
  wrap.classList.remove('open');
  icon.classList.remove('open');
}

// ═══════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════
function renderAll() {
  if (activeTab === 'entry') {
    document.getElementById('entry-section').classList.add('active');
    document.getElementById('trades-section').style.display = 'none';
  } else {
    document.getElementById('entry-section').classList.remove('active');
    document.getElementById('trades-section').style.display = '';
    renderTrades();
  }
  updateCounts();
  updateTabStyles();
  updateCatStyles();
}

function updateCounts() {
  const tab = (activeTab === 'entry') ? 'live' : activeTab;
  ['stocks','futures','options'].forEach(ck => {
    const el = document.getElementById('cnt-'+ck);
    if(el) el.textContent = state.trades[tab][ck].length;
  });
  let total = 0;
  Object.values(state.trades).forEach(sv => Object.values(sv).forEach(cv => total += cv.length));
  document.getElementById('total-count').textContent = `${total} trade${total!==1?'s':''} logged`;
}

function updateTabStyles() {
  document.querySelectorAll('.main-tab').forEach(tab => {
    tab.className = 'main-tab';
    if (tab.dataset.tab === activeTab) {
      tab.classList.add({entry:'active-entry',live:'active-live',closed:'active-closed'}[activeTab]);
    }
  });
}

function updateCatStyles() {
  if (activeTab === 'entry') return;
  const accentHex = activeTab==='live' ? '#00e676' : '#ff6b35';
  document.querySelectorAll('.cat-tab').forEach(tab => {
    const on = tab.dataset.cat === activeCat;
    tab.classList.toggle('active', on);
    tab.style.background   = on ? accentHex+'14' : '';
    tab.style.borderColor  = on ? accentHex+'44' : 'transparent';
    tab.style.color        = on ? accentHex : '';
    const bdg = tab.querySelector('.cat-badge');
    if (bdg) bdg.style.background = on ? 'rgba(0,0,0,.2)' : '';
  });
}

function renderTrades() {
  const trades = state.trades[activeTab][activeCat];
  const container = document.getElementById('trades-container');
  container.innerHTML = '';

  if (activeTab === 'closed') {
    const info = document.createElement('div');
    info.className = 'closed-info';
    info.innerHTML = `ℹ️ &nbsp;Trades moved here when you click <strong style="color:var(--closed)">CLOSE TRADE</strong> in Live Trades.`;
    container.appendChild(info);
  }

  if (!trades.length) {
    const e = document.createElement('div');
    e.className = 'empty-state';
    e.innerHTML = `<div class="empty-icon">📋</div>
      <div class="empty-text">${activeTab==='closed' ? 'NO CLOSED TRADES' : 'NO LIVE TRADES'}</div>
      <div class="empty-sub">${activeTab==='closed' ? 'Close a live trade to see it here' : 'Go to Trade Entry tab to add trades'}</div>`;
    container.appendChild(e);
    return;
  }

  trades.forEach((trade, idx) => {
    const card = editingIds.has(trade.id) ? buildEditCard(trade, idx) : buildSummaryCard(trade, idx);
    container.appendChild(card);
  });
}

// ─── SUMMARY CARD ───
function buildSummaryCard(trade, idx) {
  const isLive   = activeTab === 'live';
  const accent   = isLive ? '#00e676' : '#ff6b35';
  const sym      = trade.before.symbol || trade.after.symbol || '—';
  const catLabel = (trade.cat||activeCat).toUpperCase();
  const dateStr  = new Date(trade.createdAt).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
  const closedStr= trade.closedAt ? new Date(trade.closedAt).toLocaleDateString('en-IN',{day:'2-digit',month:'short'}) : '';

  const card = document.createElement('div');
  card.className = 'trade-card';
  card.dataset.id = trade.id;

  // Header right buttons
  const closeBtnHtml = isLive
    ? `<button class="btn-act btn-close-trade" onclick="event.stopPropagation();closeTrade('${trade.id}')">✓ CLOSE TRADE</button>`
    : (closedStr ? `<span style="font-size:8px;color:var(--muted);letter-spacing:.1em">CLOSED ${closedStr}</span>` : '');

  card.innerHTML = `
    <div class="card-header" onclick="toggleCard('${trade.id}')">
      <div class="card-header-left">
        <span class="trade-num" style="color:${accent};background:${accent}18;border-color:${accent}44">#${String(idx+1).padStart(2,'0')}</span>
        <span class="trade-sym" id="sym-${trade.id}">${esc(sym)}</span>
        <span class="trade-cat-tag" style="color:${accent};border-color:${accent}44;background:${accent}10">${catLabel}</span>
        <span class="trade-dt">${dateStr}</span>
      </div>
      <div class="card-header-right">
        ${closeBtnHtml}
        <button class="btn-act btn-edit"    onclick="event.stopPropagation();startEdit('${trade.id}')">✎ EDIT</button>
        <button class="btn-act btn-pdf"     onclick="event.stopPropagation();downloadTradePDF('${trade.id}')">⬇ PDF</button>
        <button class="btn-act btn-danger"  onclick="event.stopPropagation();deleteTrade('${trade.id}')">DELETE</button>
        <span class="chevron" id="ci-${trade.id}">▼</span>
      </div>
    </div>
    <div class="card-body" id="body-${trade.id}">
      <div class="summary-grid">
        ${buildSummaryPanel(trade, 'before')}
        ${buildSummaryPanel(trade, 'after')}
      </div>
    </div>`;

  return card;
}

function buildSummaryPanel(trade, side) {
  const isBefore = side === 'before';
  const accent   = isBefore ? 'var(--bc)' : 'var(--ac)';
  const accentHex= isBefore ? '#4488ff'   : '#00c853';
  const d        = trade[side];
  const title    = isBefore ? '◀ BEFORE CHART' : 'AFTER CHART ▶';

  // Check if after has any data
  const hasAfterData = side==='after' && (d.name||d.symbol||d.price||d.datetime||d.description||d.image);

  const imgHtml = d.image
    ? `<div class="sum-img-wrap"><img src="${d.image}" alt="chart"></div>`
    : `<div class="sum-img-wrap"><div class="sum-no-img"><div class="sum-no-img-icon">📈</div><span>No chart image</span></div></div>`;

  if (side==='after' && !hasAfterData) {
    return `
      <div class="summary-panel" style="border-color:${accentHex}20">
        <div class="sum-panel-title" style="color:${accent};border-color:${accentHex}18">${title}</div>
        <div class="no-exit-banner">
          <div class="no-exit-icon">📉</div>
          <div class="no-exit-text">EXIT NOT RECORDED YET</div>
          <div class="no-exit-sub">Click ✎ EDIT to add exit details</div>
        </div>
      </div>`;
  }

  const valOrDash = (v, type='text') => {
    if (!v) return `<span class="sum-val-empty">—</span>`;
    if (type==='date') return `<span class="sum-val">${fmtDate(v)}</span>`;
    return `<span class="sum-val">${esc(v)}</span>`;
  };

  return `
    <div class="summary-panel" style="border-color:${accentHex}20">
      <div class="sum-panel-title" style="color:${accent};border-color:${accentHex}18">${title}</div>
      ${imgHtml}
      <div class="sum-fields">
        <div class="sum-field"><div class="sum-lbl">Trade Name</div>${valOrDash(d.name)}</div>
        <div class="sum-field"><div class="sum-lbl">Symbol</div>${valOrDash(d.symbol)}</div>
        <div class="sum-row">
          <div class="sum-field"><div class="sum-lbl">Price</div>${d.price ? `<span class="sum-val">₹${esc(d.price)}</span>` : `<span class="sum-val-empty">—</span>`}</div>
          <div class="sum-field"><div class="sum-lbl">Date & Time</div>${valOrDash(d.datetime,'date')}</div>
        </div>
        <div class="sum-field"><div class="sum-lbl">Trade Logic</div>${valOrDash(d.description)}</div>
      </div>
    </div>`;
}

// ─── EDIT CARD ───
function buildEditCard(trade, idx) {
  const isLive  = activeTab === 'live';
  const accent  = isLive ? '#00e676' : '#ff6b35';
  const sym     = trade.before.symbol || trade.after.symbol || '—';
  const catLabel= (trade.cat||activeCat).toUpperCase();
  const dateStr = new Date(trade.createdAt).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});

  // Init editImages for this trade if not already
  if (!editImages[trade.id]) {
    editImages[trade.id] = { before: trade.before.image, after: trade.after.image };
  }

  const card = document.createElement('div');
  card.className = 'trade-card';
  card.dataset.id = trade.id;
  card.style.borderColor = '#4488ff44';

  card.innerHTML = `
    <div class="card-header" style="cursor:default;border-bottom-color:#4488ff33">
      <div class="card-header-left">
        <span class="trade-num" style="color:${accent};background:${accent}18;border-color:${accent}44">#${String(idx+1).padStart(2,'0')}</span>
        <span class="trade-sym">${esc(sym)}</span>
        <span class="trade-cat-tag" style="color:${accent};border-color:${accent}44;background:${accent}10">${catLabel}</span>
        <span class="trade-dt">${dateStr}</span>
        <span style="font-size:9px;color:var(--bc);letter-spacing:.1em;padding:2px 8px;border:1px solid var(--bc)44;border-radius:5px;background:var(--bc)12">✎ EDITING</span>
      </div>
      <div class="card-header-right">
        <button class="btn-act btn-save"   onclick="saveEdit('${trade.id}')">✓ SAVE</button>
        <button class="btn-act btn-cancel" onclick="cancelEdit('${trade.id}')">✕ CANCEL</button>
      </div>
    </div>
    <div class="card-body" id="body-${trade.id}">
      <div class="edit-grid">
        ${buildEditPanel(trade, 'before')}
        ${buildEditPanel(trade, 'after')}
      </div>
      <div class="edit-actions">
        <button class="btn-act btn-cancel" onclick="cancelEdit('${trade.id}')">✕ CANCEL</button>
        <button class="btn-act btn-save"   onclick="saveEdit('${trade.id}')">✓ SAVE CHANGES</button>
      </div>
    </div>`;

  setTimeout(() => {
    attachEditImageZone(trade.id, 'before');
    attachEditImageZone(trade.id, 'after');
  }, 0);

  return card;
}

function buildEditPanel(trade, side) {
  const isBefore = side === 'before';
  const accent   = isBefore ? '#4488ff' : '#00c853';
  const accentVar= isBefore ? 'var(--bc)' : 'var(--ac)';
  const title    = isBefore ? '◀ BEFORE CHART' : 'AFTER CHART ▶';
  const d        = trade[side];
  const img      = editImages[trade.id] ? editImages[trade.id][side] : d.image;
  const tid      = trade.id;

  const imgContent = img
    ? `<img src="${img}" alt="chart" class="chart-img">
       <div class="img-overlay">
         <button class="btn-sm btn-blue" onclick="editTrigger('${tid}','${side}')">CHANGE</button>
         <button class="btn-sm btn-red"  onclick="editImageClear('${tid}','${side}')">✕ REMOVE</button>
       </div>`
    : `<div class="up-placeholder"><div class="up-icon">📈</div><div class="up-text">CLICK OR DROP CHART IMAGE</div></div>`;

  return `
    <div class="form-panel" style="border-color:${accent}28">
      <div class="panel-title" style="color:${accent};border-color:${accent}22">${title}</div>
      <div class="image-zone" id="eiz-${tid}-${side}">
        ${imgContent}
        <input type="file" accept="image/*" class="hidden-input" id="efi-${tid}-${side}"
               onchange="editFileChange(this,'${tid}','${side}')">
      </div>
      <div class="field-group">
        <label class="field-label">Trade Name / Setup</label>
        <input class="field-input" id="ef2-${tid}-${side}-name" type="text"
               value="${esc(d.name)}" placeholder="Trade name / setup" style="--focus-c:${accent}">
      </div>
      <div class="field-group">
        <label class="field-label">Ticker / Symbol</label>
        <input class="field-input" id="ef2-${tid}-${side}-symbol" type="text"
               value="${esc(d.symbol)}" placeholder="NIFTY, BANKNIFTY..." style="--focus-c:${accent}">
      </div>
      <div class="field-row">
        <div class="field-group">
          <label class="field-label">${isBefore ? 'Entry' : 'Exit'} Price</label>
          <input class="field-input" id="ef2-${tid}-${side}-price" type="text"
                 value="${esc(d.price)}" placeholder="₹0.00" style="--focus-c:${accent}">
        </div>
        <div class="field-group">
          <label class="field-label">Date & Time</label>
          <input class="field-input" id="ef2-${tid}-${side}-datetime" type="datetime-local"
                 value="${esc(d.datetime)}" style="--focus-c:${accent}">
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Trade Logic / Description</label>
        <textarea class="field-input field-textarea" id="ef2-${tid}-${side}-description"
                  placeholder="Describe reasoning..." style="--focus-c:${accent}">${esc(d.description)}</textarea>
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════════
//  EDIT MODE CRUD
// ═══════════════════════════════════════════════════
function startEdit(id) {
  const trade = findTrade(id);
  if (!trade) return;
  // Initialize edit images from current trade
  editImages[id] = { before: trade.before.image, after: trade.after.image };
  editingIds.add(id);
  renderAll();
  // Scroll to card
  setTimeout(() => {
    const card = document.querySelector(`.trade-card[data-id="${id}"]`);
    if (card) card.scrollIntoView({ behavior:'smooth', block:'start' });
  }, 60);
}

function cancelEdit(id) {
  editingIds.delete(id);
  delete editImages[id];
  renderAll();
}

function saveEdit(id) {
  const trade = findTrade(id);
  if (!trade) return;

  ['before','after'].forEach(side => {
    ['name','symbol','price','datetime','description'].forEach(field => {
      const el = document.getElementById(`ef2-${id}-${side}-${field}`);
      if (el) trade[side][field] = el.value;
    });
    // Update images
    if (editImages[id]) trade[side].image = editImages[id][side];
  });

  editingIds.delete(id);
  delete editImages[id];
  saveState();
  renderAll();
  showToast('Trade updated!');
}

function toggleCard(tradeId) {
  if (editingIds.has(tradeId)) return; // Don't toggle in edit mode
  const body = document.getElementById('body-'+tradeId);
  const icon = document.getElementById('ci-'+tradeId);
  if (!body || !icon) return;
  const hidden = body.style.display === 'none';
  body.style.display = hidden ? '' : 'none';
  icon.textContent = hidden ? '▼' : '▶';
}

function deleteTrade(id) {
  if (!confirm('Delete this trade? This cannot be undone.')) return;
  for (const sv of Object.values(state.trades))
    for (const cv of Object.values(sv)) {
      const idx = cv.findIndex(t => t.id===id);
      if (idx!==-1) { cv.splice(idx,1); break; }
    }
  editingIds.delete(id);
  delete editImages[id];
  saveState();
  renderAll();
  showToast('Trade deleted.', 'info');
}

function closeTrade(id) {
  const loc = findTradeLoc(id);
  if (!loc || loc.tab!=='live') return;
  const trade = state.trades.live[loc.cat][loc.idx];
  trade.closedAt = new Date().toISOString();
  state.trades.live[loc.cat].splice(loc.idx, 1);
  state.trades.closed[loc.cat].push(trade);
  editingIds.delete(id);
  saveState();
  renderAll();
  showToast(`Trade closed → moved to Closed ${loc.cat.toUpperCase()}`, 'warning');
}

function switchTab(tab) {
  activeTab = tab;
  if (tab==='entry') {
    activeCat = 'stocks';
  } else if (tab!=='entry') {
    activeCat = activeCat || 'stocks';
  }
  renderAll();
  if (tab==='entry') {
    setTimeout(() => {
      attachEntryImageZone('before');
      attachEntryImageZone('after');
    }, 0);
  }
}

function switchCat(cat) { activeCat = cat; renderAll(); }

// ═══════════════════════════════════════════════════
//  PDF EXPORT
// ═══════════════════════════════════════════════════
async function downloadTradePDF(tradeId) {
  const trade = findTrade(tradeId);
  if (!trade) return;
  const overlay = document.createElement('div');
  overlay.className = 'pdf-overlay';
  overlay.innerHTML = `<div class="pdf-box"><div class="pdf-spin">⟳</div><div class="pdf-lbl">GENERATING PDF...</div></div>`;
  document.body.appendChild(overlay);

  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
    const W=210, H=297, M=14, colW=(W-M*2-6)/2;

    // Background
    doc.setFillColor(6,6,9); doc.rect(0,0,W,H,'F');
    // Top bar
    doc.setFillColor(8,8,15); doc.rect(0,0,W,22,'F');
    // Logo
    doc.setTextColor(0,230,118); doc.setFontSize(13); doc.setFont('helvetica','bold');
    doc.text('▲ TRADE JOURNAL', M, 13);
    // Meta
    doc.setTextColor(74,74,112); doc.setFontSize(7.5); doc.setFont('helvetica','normal');
    doc.text(`GENERATED: ${new Date().toLocaleString('en-IN')}`, W-M, 9, {align:'right'});
    doc.text(`ID: ${trade.id.toUpperCase()}`, W-M, 15, {align:'right'});

    // Trade title block
    let y = 28;
    const sym = trade.before.symbol || trade.after.symbol || '—';
    const loc = findTradeLoc(tradeId);
    doc.setFillColor(14,14,28); doc.roundedRect(M,y,W-M*2,18,3,3,'F');
    doc.setDrawColor(26,26,46); doc.roundedRect(M,y,W-M*2,18,3,3,'S');
    doc.setTextColor(0,230,118); doc.setFontSize(15); doc.setFont('helvetica','bold');
    doc.text(sym, M+7, y+12);
    doc.setTextColor(74,74,112); doc.setFontSize(7.5); doc.setFont('helvetica','normal');
    doc.text(new Date(trade.createdAt).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}), W-M-6, y+8, {align:'right'});
    doc.text(`${(loc?.tab||'').toUpperCase()} · ${(trade.cat||loc?.cat||'').toUpperCase()}`, W-M-6, y+14, {align:'right'});
    y += 24;

    // Panels
    const panels = [
      {side:'before', label:'◀ BEFORE CHART', rgb:[68,136,255]},
      {side:'after',  label:'AFTER CHART ▶',  rgb:[0,200,83]}
    ];

    for (let pi=0; pi<2; pi++) {
      const {side,label,rgb} = panels[pi];
      const d = trade[side];
      const x = M + pi*(colW+6);

      doc.setFillColor(10,10,20); doc.roundedRect(x,y,colW,122,3,3,'F');
      doc.setDrawColor(Math.round(rgb[0]*.2),Math.round(rgb[1]*.2),Math.round(rgb[2]*.2));
      doc.roundedRect(x,y,colW,122,3,3,'S');

      doc.setTextColor(...rgb); doc.setFontSize(8); doc.setFont('helvetica','bold');
      doc.text(label, x+5, y+8);
      doc.setDrawColor(Math.round(rgb[0]*.25),Math.round(rgb[1]*.25),Math.round(rgb[2]*.25));
      doc.line(x+4, y+11, x+colW-4, y+11);

      const imgY = y+14, imgH = 38;
      if (d.image) {
        try {
          doc.addImage(d.image,'JPEG',x+4,imgY,colW-8,imgH,'','FAST');
          doc.setDrawColor(...rgb.map(v=>Math.round(v*.3)));
          doc.rect(x+4,imgY,colW-8,imgH,'S');
        } catch(e) {
          doc.setFillColor(7,7,15); doc.rect(x+4,imgY,colW-8,imgH,'F');
          doc.setTextColor(42,42,69); doc.setFontSize(7); doc.setFont('helvetica','normal');
          doc.text('[NO IMAGE]',x+colW/2,imgY+imgH/2,{align:'center'});
        }
      } else {
        doc.setFillColor(7,7,15); doc.rect(x+4,imgY,colW-8,imgH,'F');
        doc.setTextColor(42,42,69); doc.setFontSize(7); doc.setFont('helvetica','normal');
        doc.text('[NO CHART IMAGE]',x+colW/2,imgY+imgH/2,{align:'center'});
      }

      let fy = imgY+imgH+6;
      function drawF(lbl, val) {
        doc.setTextColor(42,42,69); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
        doc.text(lbl.toUpperCase(), x+5, fy); fy+=4;
        doc.setTextColor(197,201,232); doc.setFontSize(7.5); doc.setFont('helvetica','normal');
        const lines = doc.splitTextToSize(val||'—', colW-10);
        doc.text(lines, x+5, fy); fy += lines.length*4.2+2;
      }
      drawF('Name', d.name);
      drawF('Symbol', d.symbol);
      drawF('Price', d.price ? '₹'+d.price : '');
      drawF('Date & Time', d.datetime ? fmtDate(d.datetime) : '');
      drawF('Trade Logic', d.description);
    }

    y += 130;
    // Notes section
    const hasNotes = trade.before.description||trade.after.description;
    if (hasNotes && y < H-30) {
      doc.setFillColor(10,10,20); doc.roundedRect(M,y,W-M*2,6,2,2,'F');
      doc.setTextColor(74,74,112); doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.text('TRADE NOTES', M+4, y+4); y+=10;
      if (trade.before.description) {
        doc.setTextColor(68,136,255); doc.setFontSize(7); doc.text('BEFORE:', M+2, y);
        doc.setTextColor(197,201,232);
        const lines = doc.splitTextToSize(trade.before.description, W-M*2-22);
        doc.text(lines, M+20, y); y+=lines.length*4+4;
      }
      if (trade.after.description && y<H-20) {
        doc.setTextColor(0,200,83); doc.setFontSize(7); doc.text('AFTER:', M+2, y);
        doc.setTextColor(197,201,232);
        const lines = doc.splitTextToSize(trade.after.description, W-M*2-22);
        doc.text(lines, M+20, y); y+=lines.length*4+4;
      }
    }

    // Footer
    doc.setFillColor(14,14,30); doc.rect(0,H-10,W,10,'F');
    doc.setTextColor(42,42,69); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text('TRADE JOURNAL — PERSONAL TRADING RECORD', M, H-4);
    doc.text('Page 1 of 1', W-M, H-4, {align:'right'});

    const fileName = `trade_${sym.replace(/[^a-zA-Z0-9]/g,'_')}_${new Date(trade.createdAt).toISOString().slice(0,10)}.pdf`;
    doc.save(fileName);
    showToast('PDF downloaded! 📄');
  } catch(err) {
    console.error(err);
    showToast('PDF generation failed.', 'error');
  } finally {
    document.body.removeChild(overlay);
  }
}

// ═══════════════════════════════════════════════════
//  XLSX / CSV EXPORT
// ═══════════════════════════════════════════════════
function buildRows() {
  const rows=[];
  Object.entries(state.trades).forEach(([sk,sv]) => {
    Object.entries(sv).forEach(([ck,trades]) => {
      trades.forEach((t,i) => {
        rows.push({
          'Status': sk==='live'?'LIVE':'CLOSED', 'Category': ck.toUpperCase(),
          'Trade #': i+1, 'Symbol': t.before.symbol||t.after.symbol||'',
          'Created At': t.createdAt, 'Closed At': t.closedAt||'',
          'Before - Name': t.before.name, 'Before - Symbol': t.before.symbol,
          'Before - Price': t.before.price, 'Before - DateTime': t.before.datetime,
          'Before - Logic': t.before.description,
          'After - Name': t.after.name, 'After - Symbol': t.after.symbol,
          'After - Price': t.after.price, 'After - DateTime': t.after.datetime,
          'After - Logic': t.after.description,
        });
      });
    });
  });
  return rows;
}
function exportXLSX() {
  const rows=buildRows();
  if(!rows.length){showToast('No trades to export!','warning');return;}
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=Object.keys(rows[0]).map(k=>({wch:Math.max(k.length+2,16)}));
  XLSX.utils.book_append_sheet(wb,ws,'All Trades');
  XLSX.writeFile(wb,`trade_journal_${new Date().toISOString().slice(0,10)}.xlsx`);
  showToast('Exported to Excel! 📊');
}
function exportCSV() {
  const rows=buildRows();
  if(!rows.length){showToast('No trades to export!','warning');return;}
  const ws=XLSX.utils.json_to_sheet(rows);
  const csv=XLSX.utils.sheet_to_csv(ws);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=`trade_journal_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  showToast('Exported to CSV!');
}

// ═══════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════
let toastTimer;
function showToast(msg,type='success'){
  clearTimeout(toastTimer);
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.className=`toast toast-${type} show`;
  toastTimer=setTimeout(()=>el.className='toast',2800);
}

loadState();
applyTheme();
renderAll();

setTimeout(() => {
  attachEntryImageZone('before');
  attachEntryImageZone('after');
}, 0);
